<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>aframe-material😲😆😛</title>
    <meta name="description" content="Aframe-Material">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="dist/aframe-material.js"></script>
    <script type="text/javascript">
      AFRAME.ASSETS_PATH = "./assets";
    </script>
    <script>
      // Demo-only gradient sky shader
      AFRAME.registerShader('am-gradient', {
        schema: {
          topColor:  { type: 'color', default: '#88c0ff' },
          bottomColor:{ type: 'color', default: '#ffffff' }
        },
        init: function (data) {
          this.uniforms = {
            topColor: { value: new THREE.Color(data.topColor) },
            bottomColor: { value: new THREE.Color(data.bottomColor) }
          };
          this.material = new THREE.ShaderMaterial({
            uniforms: this.uniforms,
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform vec3 topColor;
              uniform vec3 bottomColor;
              varying vec2 vUv;
              void main() {
                vec3 col = mix(bottomColor, topColor, clamp(vUv.y, 0.0, 1.0));
                gl_FragColor = vec4(col, 1.0);
              }
            `,
            side: THREE.BackSide,
            depthWrite: false,
            fog: true
          });
        },
        update: function (data) {
          if (!this.uniforms) return;
          this.uniforms.topColor.value.set(data.topColor);
          this.uniforms.bottomColor.value.set(data.bottomColor);
        }
      });

      AFRAME.registerPrimitive('a-gradient-sky', {
        defaultComponents: {
          geometry: { primitive: 'sphere', radius: 5000 },
          material: { shader: 'am-gradient', side: 'back', fog: true }
        },
        mappings: {
          'top-color': 'material.topColor',
          'bottom-color': 'material.bottomColor'
        }
      });
    </script>
  </head>
  <body>
    <a-scene material-form>
      <a-entity laser-controls="hand: right"></a-entity>

      <a-entity> <a-camera look-controls-enabled wasd-controls-enabled></a-camera></a-entity>

      <!-- BEGIN INPUTS/KEYBOARD -->
      <a-keyboard physical-keyboard="true"></a-keyboard>
      <a-form>
      <a-input position="-0.7 1 -2.5" placeholder="Username" color="black" width="1"></a-input>
      <a-input position="-0.7 0.8 -2.5" type="password" placeholder="Password" color="black" width="1"></a-input>
      <a-textarea
        position="-3.0 0.4 -2.7"
        width="1.4"
        height="0.6"
        padding-x="0.03"
        padding-y="0.03"
        line-height="0.1"
        placeholder="Your message..."
        color="#111"
        background-color="#EEE"
        background-opacity="1"
        border-color="#666"
        border-width="0.005"
      ></a-textarea>
      </a-form>
      <!-- END INPUTS/KEYBOARD -->

      <!-- BEGIN FORM -->
      <a-rounded position="0.5 0.5 -2.5" width="4" height="3.1" radius="0.05" rotation="0 -20 0" scale="0.3 0.3 0.3">
        <a-form>
          <a-switch position="0.2 2.7 0" enabled="true"></a-switch>
          <a-radio position="0.2 2.4 0" width="3" name="food" label="Burger with fries and pizza" value="pizza"></a-radio>
          <a-radio position="0.2 2.1 0" width="3" name="food" label="Veggies" checked="true" disabled="true"></a-radio>
          <a-radio position="0.2 1.8 0" width="3" name="food" label="Ice cream"></a-radio>
          <a-checkbox position="0.2 1.5 0" width="3" name="stuff" label="I am a checkbox" checked="true"></a-checkbox>
          <a-checkbox position="0.2 1.2 0" width="3" name="stuff" label="And I am another one" checked="true" disabled="true"></a-checkbox>
          <a-button position="0.2 0.8 0" name="stuff" value="Click me" type="raised"></a-button>
          <a-button position="0.2 0.35 0" width="3" name="stuff" value="You cannot click me" disabled="true"></a-button>
        </a-form>
      </a-rounded>
      <!-- END FORM -->

      <!-- BEGIN TOAST -->
      <a-toast message="This is a toast" action="Got it"></a-toast>
      <!-- END TOAST -->

      <!-- BEGIN ENVIRONMENT -->
      <a-gradient-sky material="shader: am-gradient; topColor: #ff0000; bottomColor: #0079ff;"></a-gradient-sky>
      <!-- END ENVIRONMENT -->
    </a-scene>
    <script type="text/javascript">
      let button = document.querySelector('a-button');
      let toast = document.querySelector('a-toast');
      toast.addEventListener('actionclick', ()=>{
        toast.hide();
      });
      button.addEventListener('click', ()=> {
        toast.show();
      });
    </script>
  </body>
</html>
